        '423': { $ref: '#/components/responses/Locked' }
  /dictionary:
    get:
      summary: 搜索/分页列出当前账户的 Dictionary 词条
      description: |
        仅 root token。排序固定为 manual 在前、learned 在后，同来源按 updated_at DESC, id ASC。
        query 经统一规范化后对 normalized_term 做包含匹配（SQL LIKE 的 %、_ 与 escape 字符按普通字符处理）。
        cursor 绑定排序元组与 query 摘要：无法解码、与当前 query 不匹配或指向非法排序值时返回 400。
      x-required-root: true
      parameters:
        - { in: query, name: query, schema: { type: string, maxLength: 128 }, description: 可选；最多 128 个 Unicode scalar value }
        - { in: query, name: cursor, schema: { type: string }, description: 分页游标（上一页响应的 next_cursor 原样透传） }
        - { in: query, name: limit, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '423': { $ref: '#/components/responses/Locked' }
  /dictionary/entries:
    post:
      summary: 增量添加词条（单条或小批量）
      description: |
        仅 root token。整请求校验：任一词条非法（空值/控制字符/纯标点空白/超长）或写入后将超过单账户容量
        （1,000 条）时返回 422 且零写入（dictionary_invalid_term / dictionary_limit_exceeded）。
        增量语义：请求内重复与既有 manual 词条计入 skipped_count；与既有 learned 词条冲突时更新其规范写法、
        提升为 manual 并清空 learning_event_id（计入 promoted）。新增、提升与去重在同一事务内完成，
        数据库 UNIQUE(normalized_term) 为最终并发去重边界；并发冲突折算到 skipped_count，不暴露 409。
      x-required-root: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddDictionaryEntriesRequest' }
      responses:
        '200':
          description: 增量写入统计（部分词条可能计入 promoted/skipped）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryMutationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '423': { $ref: '#/components/responses/Locked' }
    delete:
      summary: 清空当前账户全部用户词条
      description: 仅 root token；幂等。删除全部 manual 与 learned 词条（未来系统保护词条不经本操作删除）。UI 必须先明确影响并二次确认。
      x-required-root: true
      responses:
        '204': { description: 已清空（幂等） }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '423': { $ref: '#/components/responses/Locked' }
  /dictionary/entries/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    put:
      summary: 编辑词条的规范写法
      description: |
        仅 root token。仅接受 {term}，由服务端执行权威规范化。与另一词条规范化冲突返回 409（dictionary_conflict）。
        编辑 learned 词条会将其提升为 manual 并清空 learning_event_id（不再受撤销影响）。
      x-required-root: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                term: { type: string, minLength: 1, maxLength: 128 }
              required: [term]
              additionalProperties: false
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '423': { $ref: '#/components/responses/Locked' }
    delete:
      summary: 删除单条词条
      description: 仅 root token；幂等，存在或不存在均返回 204。
      x-required-root: true
      responses:
        '204': { description: 已删除（幂等） }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '423': { $ref: '#/components/responses/Locked' }
  /dictionary/imports/preview:
    post:
      summary: 预览 CSV 增量导入结果
      description: |
        仅 root token。使用与正式导入相同的 CSV 解析、词条校验、规范化和当前词典状态，返回只读统计，
        不写入词条或学习事件。预览不锁定数据库状态；正式提交时必须重新校验并以提交结果为准。
      x-required-root: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportDictionaryCsvRequest' }
      responses:
        '200':
          description: 导入预览统计（解析/有效/预计新增/预计提升/预计跳过）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryImportPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '423': { $ref: '#/components/responses/Locked' }
  /dictionary/imports:
    post:
      summary: CSV 增量导入词条
      description: |
        仅 root token。body 为 JSON 包裹的 UTF-8 CSV 文本：固定且仅允许单列 term 表头，RFC 4180 字段引用与双引号
        转义，允许 UTF-8 BOM 与 LF/CRLF，空白物理行忽略。CSV 语法错误、缺少/重复/未知表头、额外列、显式空 term、
        非法词条或超过 1,000 条数据记录时返回 422（dictionary_csv_invalid / dictionary_invalid_term），
        整次导入零写入。合法请求在一个事务内增量插入，不删除既有词条；合法重复记录按增量语义计入 skipped_count。
        客户端可先调用 /dictionary/imports/preview 展示预计统计；正式提交会重新校验，最终以本响应为准。
      x-required-root: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportDictionaryCsvRequest' }
      responses:
        '200':
          description: 导入统计（解析数/新增/提升/跳过）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryImportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '423': { $ref: '#/components/responses/Locked' }
  /dictionary/export:
    get:
      summary: 导出当前账户全部用户词条为 CSV
