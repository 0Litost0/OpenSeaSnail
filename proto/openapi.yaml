        写文件，文件路径不进入 daemon，导出不依赖 UI 当前分页状态。固定输出 term 表头 + RFC 4180 记录，
        不输出 BOM、内部 ID、来源、时间戳或事件 ID；顺序固定 normalized_term ASC, id ASC；
        导出内容可由 POST /dictionary/imports 无损重新导入。
      x-internal: true
      x-required-root: true
      responses:
        '200':
          description: "UTF-8 CSV（Content-Type: text/csv; charset=utf-8；下载文件名 seasnail-dictionary.csv）"
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '423': { $ref: '#/components/responses/Locked' }
  /models:
    get:
      summary: 列出模型（已装 + 可装）
      x-required-scope: sessions:read
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Model' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /models/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      summary: 激活模型
      description: |
        仅本地 UI（sessions:write）。`action=activate` 切换活跃模型（复用模型切换链路）；
        活跃 sidecar 转写中时返回 409。对已激活模型重复请求会返回当前状态，不重启运行时。
        最终 release 仅允许激活默认 GGUF 模型；非默认后端仅能由带
        `debug-backend-switching` 构建标识的内部迁移包显式选择，并在重启后生效。
        多模型下载、下载进度与卸载属于 P1，尚未暴露 API。
      x-required-scope: sessions:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [activate] }
              required: [action]
      responses:
        '202':
          description: 已接受（下载中 / 切换中）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Model' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    put:
      summary: 开/关可选组件（punc/spk）
      description: |
        仅本地 UI（sessions:write）。懒加载：仅持久化 `enabled`，下一条转写才挂载/卸载。
        未下载即开启 → 422。`{id}`∈{punc,spk} 为可选组件，与 activate（`{id}`∈后端 id）
        语义不同；同路径不同方法，不撞。
      x-required-scope: sessions:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
              required: [enabled]
      responses:
        '202': { description: 已持久化（懒，下条转写生效） }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /models/{id}/download:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      summary: 按需下载组件（punc/spk）
      description: |
        仅本地 UI（sessions:write）。对未下载组件触发后台下载（HTTP Range 断点续传 + 逐文件
        SHA-256 校验），立即返回 202；进度经 GET /models 的 Component.download_progress 轮询。
        已下载重复请求幂等返 202；下载进行中再发返 409。`{id}`∈{punc,spk}；spk 本次后置 → 422。
        与 `/models/{id}` 的 activate(POST)/开关(PUT) 路径段数不同，不撞。
      x-required-scope: sessions:write
      responses:
        '202': { description: 已接受，下载中（轮询 GET /models 取 download_progress） }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
