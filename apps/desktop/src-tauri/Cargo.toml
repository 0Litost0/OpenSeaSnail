[package]
license = "Apache-2.0"
name = "seasnail-desktop"
version = "0.1.0"
edition = "2021"
description = "SeaSnail macOS GUI shell"
default-run = "seasnail-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
seasnail-crypto = { path = "../../../crates/crypto" }
seasnail-daemon = { path = "../../../crates/daemon" }
seasnail-proto = { path = "../../../crates/proto" }
seasnail-desktop-core = { path = "../../../crates/desktop-core" }
prost = "0.13"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
arboard = "3.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
png = "0.18"
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
libc = "0.2"
unicode-segmentation = "1.12"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem", "NSWindow", "NSWorkspace"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "c9ec2130422200f0863b23dfdad02b133a529b07" }

[dev-dependencies]
tempfile = "3"
