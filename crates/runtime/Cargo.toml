[package]
license = "Apache-2.0"
name = "seasnail-runtime"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Debug-only escape hatch. Code is additionally gated by debug_assertions and
# emits content only when the input hash is the locked public zh.wav fixture.
sherpa-fixture-diagnostics = []

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "time", "net", "sync", "fs"] }
axum = { version = "0.7", features = ["multipart"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json"] }
tracing = "0.1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tempfile = "3"
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
