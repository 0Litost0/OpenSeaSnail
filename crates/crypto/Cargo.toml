[package]
license = "Apache-2.0"
name = "seasnail-crypto"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
hkdf = "0.12"
http = "1"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
thiserror = "1"
uuid = "1"
zeroize = "1"

[dev-dependencies]
static_assertions = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", features = ["OSX_10_15"] }
security-framework-sys = "2"
