[package]
license = "Apache-2.0"
name = "seasnail-api-regression-poc"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "seasnail-poc-host"
path = "rust/host.rs"

[[test]]
name = "comparison"
path = "rust/comparison.rs"

[dependencies]
seasnail-daemon = { path = "../../../crates/daemon" }
seasnail-crypto = { path = "../../../crates/crypto" }
seasnail-runtime = { path = "../../../crates/runtime" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
tempfile = "3"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
